<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dan's Book Library</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #1a1208; --paper: #f5f0e8; --cream: #ede8d8;
    --amber: #c8893a; --amber-light: #e8a84a;
    --teal: #2a6b6e; --muted: #6b6050;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }
  .hero { background: var(--ink); padding: 48px 40px 40px; }
  .hero-label { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--amber); margin-bottom: 12px; }
  .hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(28px, 5vw, 48px); color: #f5f0e8; line-height: 1.15; }
  .hero h1 em { color: var(--amber-light); font-style: italic; }
  .hero p { color: var(--muted); font-size: 14px; margin-top: 12px; max-width: 480px; line-height: 1.6; }
  .hero-stats { display: flex; gap: 32px; margin-top: 24px; }
  .hero-stat .num { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--amber-light); }
  .hero-stat .lbl { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .controls { padding: 20px 40px; background: var(--cream); border-bottom: 1px solid rgba(200,137,58,0.15); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .filter-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(200,137,58,0.3); background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; letter-spacing: 0.5px; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
  .filter-btn:hover, .filter-btn.active { background: var(--amber); border-color: var(--amber); color: white; }
  .grid-container { padding: 32px 40px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .book-card { background: white; border: 1px solid rgba(26,18,8,0.08); border-radius: 12px; padding: 24px; text-decoration: none; color: inherit; display: block; transition: all 0.2s; position: relative; overflow: hidden; }
  .book-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--amber); transform: scaleX(0); transform-origin: left; transition: transform 0.25s; }
  .book-card:hover { box-shadow: 0 8px 28px rgba(200,137,58,0.14); transform: translateY(-2px); }
  .book-card:hover::before { transform: scaleX(1); }
  .card-genre { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .genre-tag { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--teal); background: rgba(42,107,110,0.08); border-radius: 10px; padding: 3px 10px; }
  .card-title { font-family: 'Playfair Display', serif; font-size: 20px; line-height: 1.25; margin-bottom: 6px; }
  .card-author { font-size: 12px; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 14px; }
  .card-verdict { font-size: 13px; color: #3a3020; line-height: 1.55; margin-bottom: 16px; font-style: italic; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; }
  .card-rating { font-family: 'Playfair Display', serif; color: var(--amber); font-size: 16px; }
  .card-arrow { color: var(--amber); font-size: 18px; }
  .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty-state h3 { font-family: 'Playfair Display', serif; font-size: 24px; margin-bottom: 8px; }
  @media (max-width: 560px) {
    .hero { padding: 36px 20px 32px; }
    .controls { padding: 16px 20px; }
    .grid-container { padding: 20px 20px 40px; }
    .hero-stats { gap: 20px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-label">📚 Personal Library</div>
  <h1>Dan's <em>Book Reviews</em></h1>
  <p>A curated collection of notes, summaries, and reflections on books I've read.</p>
  <div class="hero-stats">
    <div class="hero-stat">
      <div class="num" id="book-count">0</div>
      <div class="lbl">Books Reviewed</div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="filter-btn active" onclick="filterBooks('all', this)">All</button>
</div>

<div class="grid-container">
  <div class="grid" id="book-grid"></div>
</div>

<script>
  const books = [
    {
      title: "Traction",
      author: "Gino Wickman",
      year: "2011",
      slug: "traction",
      genres: ["Business Operations", "Leadership"],
      rating: 4.5,
      verdict: "A complete operating system for entrepreneurial companies — six components, proven tools, and a two-year commitment that transforms how leadership teams think and execute."
    },
    {
      title: "Building a Second Brain",
      author: "Tiago Forte",
      year: "2022",
      slug: "building-a-second-brain",
      genres: ["Productivity", "Knowledge Management"],
      rating: 3.5,
      verdict: "Dan's rating. Really good ideas and very actionable on paper, but he finds it hard to build into his own life; readers rate it 4.02 on Goodreads."
    },
    {
      title: "Process!",
      author: "Mike Paton & Lisa González",
      year: "2022",
      slug: "process",
      genres: ["Business Operations", "EOS"],
      rating: 4.5,
      verdict: "Dan's rating. A quick, usable guide to building processes people will actually follow, which he uses in his own work; no Goodreads average was available."
    },
    {
      title: "What the Heck Is EOS?",
      author: "Gino Wickman & Tom Bouwer",
      year: "2017",
      slug: "what-the-heck-is-eos",
      genres: ["Business Operations", "EOS"],
      rating: 4,
      verdict: "Dan's rating. Great, quick-to-read ideas his company is implementing, though it undersells how big the shift is; readers rate it 3.62 on Goodreads."
    },
    {
      title: "Generations",
      author: "Jean M. Twenge, PhD",
      year: "2023",
      slug: "generations",
      genres: ["Social Science", "Psychology", "Culture"],
      rating: 4.3,
      verdict: "The most rigorous, data-grounded examination of generational difference available — read it before forming another opinion about why younger employees work differently than you do."
    },
    {
      title: "Surrounded by Idiots",
      author: "Thomas Erikson",
      year: "2019",
      slug: "surrounded-by-idiots",
      genres: ["Psychology", "Communication", "Self-Help"],
      rating: 4.0,
      verdict: "A breezy, sticky framework for naming why your coworkers drive you crazy — thin on science, strong on immediate, practical usefulness."
    },
    {
      title: "Dare to Lead",
      author: "Brené Brown",
      year: "2018",
      slug: "dare-to-lead",
      genres: ["Leadership", "Vulnerability & Courage", "Psychology"],
      rating: 4,
      verdict: "Dan's rating. A very readable, thought-provoking book on leading with vulnerability, lighter on ideas and actions; readers rate it about 4.17 on Goodreads."
    },
    {
      title: "The First 90 Days",
      author: "Michael D. Watkins",
      year: "2013",
      slug: "the-first-90-days",
      genres: ["Leadership", "Career Strategy", "Onboarding"],
      rating: 3,
      verdict: "Dan's rating. Glad he read it once, mainly for the lessons on relying on your team, but he disagrees with its bulldozing approach and struggled to get through it; no Goodreads average could be read."
    },
    {
      title: "Switch",
      author: "Chip Heath & Dan Heath",
      year: "2010",
      slug: "switch",
      genres: ["Change Management", "Behavioral Psychology", "Leadership"],
      rating: 3,
      verdict: "Dan's rating. He relates to the Rider, Elephant and Path, but wanted more on how to enact change; readers rate it 4.03 on Goodreads."
    },
    {
      title: "Mindset",
      author: "Dr. Carol S. Dweck",
      year: "2006",
      slug: "mindset",
      genres: ["Psychology", "Growth Mindset", "Self-Development"],
      rating: 5,
      verdict: "Dan's rating. A book he treats as gospel and acts on in his own life, for its usable ideas and research depth; readers rate it 4.09 on Goodreads."
    },
    {
      title: "The 7 Habits of Highly Effective People",
      author: "Stephen R. Covey",
      year: "1989",
      slug: "the-7-habits-of-highly-effective-people",
      genres: ["Self-Help", "Personal Development", "Leadership"],
      rating: 4,
      verdict: "Dan's rating, from memory of a long-ago read: good ideas, and Begin with the End in Mind stuck; readers rate it 4.16 on Goodreads."
    },
    {
      title: "Getting Things Done",
      author: "David Allen",
      year: "2015",
      slug: "getting-things-done",
      genres: ["Productivity", "Personal Effectiveness", "Time Management"],
      rating: 4.5,
      verdict: "Dan's rating. It changed how he gets things done and he still builds his lists on it, though he now finds the method cumbersome; readers rate it 4.00 on Goodreads."
    },
    {
      title: "The Subtle Art of Not Giving a F*ck",
      author: "Mark Manson",
      year: "2016",
      slug: "the-subtle-art-of-not-giving-a-fuck",
      genres: ["Self-Help", "Personal Development", "Psychology"],
      rating: 5,
      verdict: "Dan's rating. A book he'd gladly rate a 6 out of 5 and keeps recommending, about choosing what to care about; readers rate it 3.85 on Goodreads."
    },
    {
      title: "Atomic Habits",
      author: "James Clear",
      year: "2018",
      slug: "atomic-habits",
      genres: ["Habit Formation", "Productivity", "Behavioral Psychology"],
      rating: 5,
      verdict: "Dan's rating. The best book in the library for him, a life-changing aha moment he keeps rereading and recommending; readers rate it 4.30 on Goodreads."
    },
    {
      title: "What Got You Here Won't Get You There",
      author: "Marshall Goldsmith",
      year: "2007",
      slug: "what-got-you-here-wont-get-you-there",
      genres: ["Executive Coaching", "Leadership", "Behavior Change"],
      rating: 4.6,
      verdict: "A precise, humbling field guide to the interpersonal habits that quietly cap otherwise brilliant careers — feedback, apologizing, and feedforward turned into a process you can start using today."
    },
    {
      title: "If You're Not First, You're Last",
      author: "Grant Cardone",
      year: "2010",
      slug: "if-youre-not-first-youre-last",
      genres: ["Sales", "Business Development", "Mindset"],
      rating: 3.9,
      verdict: "A high-energy, activity-first sales manual: reactivate your network, follow up on the unsold, hold your price, and protect your selling time."
    },
    {
      title: "Radical Candor",
      author: "Kim Scott",
      year: "2019",
      slug: "radical-candor",
      genres: ["Leadership", "Management", "Communication"],
      rating: 4.6,
      verdict: "The clearest map of feedback ever drawn — Care Personally and Challenge Directly, with Ruinous Empathy, Obnoxious Aggression, and Manipulative Insincerity as the three ways to fall off the tightrope."
    },
    {
      title: "The Gift",
      author: "Lewis Hyde",
      year: "1983",
      slug: "the-gift",
      genres: ["Creativity", "Philosophy", "Culture"],
      rating: 0.5,
      verdict: "Dan's rating. A long, one-sided meditation on gift versus market economies that left him with little to use; readers rate it 3.90 on Goodreads for one durable idea and its prose."
    }
  ];

  function renderCards(filter) {
    const grid = document.getElementById('book-grid');
    const filtered = filter === 'all' ? books : books.filter(b => b.genres.includes(filter));
    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty-state"><h3>No books in this category yet</h3><p>More reviews coming soon.</p></div>';
      return;
    }
    grid.innerHTML = filtered.map(b => `
      <a href="${b.slug}.html" class="book-card" data-genres="${b.genres.join(',')}">
        <div class="card-genre">${b.genres.map(g => `<span class="genre-tag">${g}</span>`).join('')}</div>
        <div class="card-title">${b.title}</div>
        <div class="card-author">by ${b.author} · ${b.year}</div>
        <div class="card-verdict">${b.verdict}</div>
        <div class="card-footer">
          <div class="card-rating">⭐ ${b.rating} / 5</div>
          <div class="card-arrow">→</div>
        </div>
      </a>
    `).join('');
  }

  function buildFilters() {
    const all = new Set(books.flatMap(b => b.genres));
    const controls = document.querySelector('.controls');
    all.forEach(g => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = g;
      btn.onclick = function() { filterBooks(g, this); };
      controls.appendChild(btn);
    });
  }

  function filterBooks(filter, el) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderCards(filter);
  }

  document.getElementById('book-count').textContent = books.length;
  buildFilters();
  renderCards('all');
</script>
</body>
</html>
